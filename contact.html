<!DOCTYPE html>
<html lang="ja">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9319517564080738"
    crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-9319517564080738">
  <meta charset="UTF-8">
  <title>お問い合わせ | もみこ マジックカード攻略</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=260511-4">
  <style>
    .contact-page {
      min-height: 100vh;
      color: #dcddde;
      background: #313338;
      font-family: sans-serif;
    }

    .contact-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 42px 20px 56px;
    }

    .contact-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .contact-nav a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: #c9ced8;
      background: rgba(35, 36, 40, 0.72);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .contact-nav a:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .contact-hero,
    .contact-form-card {
      border: 1px solid rgba(79, 84, 92, 0.95);
      border-radius: 10px;
      background: #2b2d31;
    }

    .contact-hero {
      padding: 24px;
      margin-bottom: 18px;
    }

    .contact-hero h1 {
      margin: 0 0 10px;
      color: #fff;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.15;
    }

    .contact-hero p {
      max-width: 760px;
      margin: 0;
      color: #dcddde;
      line-height: 1.8;
    }

    .contact-note {
      margin-top: 12px;
      color: #949ba4;
      font-size: 0.9rem;
    }

    .contact-form-card {
      overflow: hidden;
    }

    .contact-form-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(79, 84, 92, 0.95);
    }

    .contact-form-head strong {
      color: #fff;
      font-size: 1rem;
    }

    .contact-form-head a {
      color: #c9ced8;
      font-size: 0.86rem;
      font-weight: 800;
      text-decoration: none;
    }

    .contact-form-head a:hover {
      color: #fff;
    }

    .contact-form-frame {
      width: 100%;
      height: 980px;
      display: block;
      border: 0;
      background: #fff;
    }

    @media (max-width: 640px) {
      .contact-wrap {
        padding: 24px 12px 40px;
      }

      .contact-hero {
        padding: 18px;
      }

      .contact-form-head {
        display: block;
      }

      .contact-form-head a {
        display: inline-block;
        margin-top: 6px;
      }

      .contact-form-frame {
        height: 1040px;
      }
    }
  </style>
</head>

<body class="contact-page">
  <main class="contact-wrap">
    <nav class="contact-nav" aria-label="サイト内リンク">
      <a href="javascript:history.back();"><i class="fa-solid fa-chevron-left"></i>&nbsp;戻る</a>
      <a href="index.html">トップ</a>
      <a href="about.html">運営者情報</a>
      <a href="policy.html">プライバシーポリシー</a>
    </nav>

    <section class="contact-hero">
      <h1>お問い合わせ</h1>
      <p>当サイトへのご意見、ご質問、お仕事のご依頼などは、以下のフォームよりご連絡ください。</p>
      <div class="contact-note">返信には数日お時間をいただく場合があります。</div>
    </section>

    <section class="contact-form-card" aria-label="お問い合わせフォーム">
      <div class="contact-form-head">
        <strong>Googleフォーム</strong>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe5EgKAg1j7zJlu_sxdoH28pZ0FH2udC36BzJrVVGmpuebeHA/viewform?usp=sf_link" target="_blank" rel="noopener">別タブで開く</a>
      </div>
      <iframe
        class="contact-form-frame"
        src="https://docs.google.com/forms/d/e/1FAIpQLSe5EgKAg1j7zJlu_sxdoH28pZ0FH2udC36BzJrVVGmpuebeHA/viewform?embedded=true"
        title="お問い合わせフォーム"
        loading="lazy">
        読み込んでいます…
      </iframe>
    </section>
  </main>
</body>

</html>
